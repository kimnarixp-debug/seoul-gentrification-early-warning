<script>
{
  const msg=document.getElementById('msg');
  let dl=null;
  claude.use('downloads').then(d=>{dl=d; if(!d) msg.textContent='이 화면에서는 내려받기를 쓸 수 없습니다. 브라우저에서 이 페이지를 열어 주세요.';});
  document.querySelectorAll('button.item').forEach(b=>b.addEventListener('click',async()=>{
    if(!dl){msg.textContent='내려받기를 준비하는 중입니다. 잠시 뒤 다시 눌러 주세요.';return;}
    msg.textContent='파일을 준비하는 중…';
    try{
      let data;
      if(b.dataset.src==='files/script.docx'){
        const s=atob(JSON.parse(document.getElementById('docx').textContent));
        data=new Uint8Array(s.length); for(let i=0;i<s.length;i++) data[i]=s.charCodeAt(i);
      } else {
        const r=await fetch(b.dataset.src); if(!r.ok) throw {code:'fetch'}; data=await r.blob();
      }
      await dl.save({filename:b.dataset.name,data});
      msg.textContent='저장했습니다: '+b.dataset.name;
    }catch(e){
      const c=e&&e.code;
      msg.textContent=c==='declined'?'저장을 취소했습니다.':c==='rate_limited'?'잠시 뒤 다시 눌러 주세요.':c==='host_unavailable'?'이 앱에서는 파일을 저장할 수 없습니다. 브라우저나 컴퓨터에서 열어 주세요.':'파일을 저장하지 못했습니다. 다시 시도해 주세요.';
    }
  }));
}
</script>
