<aside>가장 많은 것은 개업도 폐업도 적은 안정형으로 40%입니다. 20~30대 매출이 45%인 청년상권형이 28%로, 성수동카페거리와 성수역이 여기 속합니다. 점포당 매출과 밀도가 가장 높은 고매출밀집형은 강남역, 명동, 대형 시장 같은 중심가입니다. 처음 기대한 과열형은 따로 나오지 않았습니다.</aside>
