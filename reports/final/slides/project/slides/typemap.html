(애니메이션을 틀며) 이 지도를 시간 순서로 넘겨 보겠습니다. 하얗게 빛나는 곳이 그 분기에 한 단계 올라간 상권입니다. 매 분기 80곳 정도가 반짝입니다. 그런데 오른쪽 그래프를 보면 전체 비율은 거의 그대로입니다. 올라가는 곳만큼 내려오는 곳도 있다는 뜻입니다.

그래서 한 분기씩 보면 잘 안 보이고, 몇 년을 묶어서 봐야 진짜 흐름이 보입니다.</aside>
